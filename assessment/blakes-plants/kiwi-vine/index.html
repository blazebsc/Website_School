<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiwi Vine</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="plant-page">
      <a href="../" class="back-link">&larr; Back to All Plants</a>
      <h1>Kiwi Vine</h1>
      <div class="plant-image-container">
        <img src="kiwi-vine.jpg" alt="Kiwi Vine" class="plant-hero" />
      </div>
      <div class="plant-info">
        <h4>Learn more about Kiwi. This plant is a great addition to any indoor or outdoor garden.</h4>
        <h2>Care Tips</h2>
        <ul>
          <li><h5>Provide adequate sunlight based on plant needs</h5></li>
          <li><h5>Water regularly but avoid overwatering</h5></li>
          <li><h5>Use well-draining soil</h5></li>
          <li><h5>Monitor for pests and diseases</h5></li>
        </ul>
      </div>
    
    <div class="quantity-controls">
      <button class="qty-btn" onclick="changeQty(-1)">-</button>
      <span id="qty-display">1</span>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <button class="add-to-cart-btn" onclick="addToCart('kiwi-vine')">Add to Cart</button>

    </div>
  </body>
</html>
